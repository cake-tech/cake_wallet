[package]
name = "cw_starknet_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
async-trait = "0.1.89"
starknet-rust = "0.19.0-rc.2"
starknet-rust-curve = "0.19.0-rc.2"
bip39 = "2.2.0"
hmac = "0.12.1"
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "time"] }
once_cell = "1.21.3"
num-bigint = "0.4.6"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-no-provider"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
