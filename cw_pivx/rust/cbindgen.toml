# cbindgen configuration for cw_pivx_sapling
# Generates C headers for FFI bindings

language = "C"

# Output settings
header = "/* PIVX Sapling FFI - Auto-generated by cbindgen */"
include_guard = "CW_PIVX_SAPLING_H"
autogen_warning = "/* Warning: this file was auto-generated by cbindgen. Don't modify this manually. */"
include_version = true
cpp_compat = false

[parse]
parse_deps = false

[export]
include = []
exclude = []
prefix = ""

[fn]
args = "Vertical"
sort_by = "Name"

[struct]
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false

[enum]
add_sentinel = false
prefix_with_name = false
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false

[const]
allow_static_const = true

[defines]
