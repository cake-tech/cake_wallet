# Layer-B e2e lane, iOS (QA handoff §6 4-b). REPORT-ONLY like the Android lane
# (continue-on-error at job level; never a required check).
#
# Both jobs run in throwaway VMs (cake-tech/mac-ci-runner): each gets a fresh
# macOS VM that reaches the internet and nothing else, deleted when the job ends.
#   build  builds this ref's simulator app. No environment, no secrets.
#   e2e    installs that app and runs the suite with the qa secrets. It never
#          checks out or builds this repository's code.
name: E2E (iOS)

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "e.g. 2/3 (empty = single run)"
        type: string
        default: ""
      qa_ref:
        description: "cake-qa git ref to test (empty = that repo's default branch)"
        type: string
        default: ""
      suite:
        description: "test file/glob to run (empty = the no-funds slice)"
        type: string
        default: ""
      grep:
        description: "only tests whose title matches this regular expression (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, cake-m5-ultra]
    # REPORT-ONLY, permanently until Seth says otherwise.
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Checkout the app
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the simulator app
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: user.email
          GIT_CONFIG_VALUE_0: ci@example.invalid
          GIT_CONFIG_KEY_1: user.name
          GIT_CONFIG_VALUE_1: CI
        run: bash scripts/ci/ios_sim_build.sh "$GITHUB_WORKSPACE"

      - name: Pack the app
        run: tar -C build/ios/iphonesimulator -czf "$RUNNER_TEMP/Runner.app.tgz" Runner.app

      - name: Hand the app to the suite job
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-app
          path: ${{ runner.temp }}/Runner.app.tgz
          if-no-files-found: error
          retention-days: 3

  e2e:
    needs: build
    runs-on: [self-hosted, cake-m5-ultra]
    environment: qa
    # REPORT-ONLY, permanently until Seth says otherwise.
    continue-on-error: true
    timeout-minutes: 180
    steps:
      - name: Checkout the QA project (cake-qa, via deploy key)
        uses: actions/checkout@v4
        with:
          repository: cake-tech/cake-qa
          ref: ${{ inputs.qa_ref || 'main' }}
          path: cake-qa
          ssh-key: ${{ secrets.QA_DEPLOY_KEY }}
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install the QA project
        working-directory: cake-qa
        run: npm ci

      - name: Download the app
        uses: actions/download-artifact@v4
        with:
          name: e2e-ios-app
          path: ${{ runner.temp }}

      - name: Unpack the app
        run: |
          mkdir -p app
          tar -C app -xzf "$RUNNER_TEMP/Runner.app.tgz"
          test -d app/Runner.app

      - name: Simulator runtime
        # The VM template carries Xcode but no simulator runtime.
        run: xcrun simctl list runtimes | grep -q '^iOS' || xcodebuild -downloadPlatform iOS

      - name: Boot the simulator and install
        run: |
          set -euo pipefail
          read -r RUNTIME DEVICE_TYPE < <(xcrun simctl list runtimes -j | python3 -c "
          import json,re,sys
          rts=[r for r in json.load(sys.stdin)['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable',True)]
          rts.sort(key=lambda r: [int(x) for x in r['version'].split('.')])
          rt=rts[-1]
          ds=[d for d in rt['supportedDeviceTypes'] if d.get('productFamily')=='iPhone']
          pick=([d for d in ds if re.fullmatch(r'iPhone \\d+ Pro', d['name'])] or [d for d in ds if re.fullmatch(r'iPhone \\d+', d['name'])] or ds)[-1]
          print(rt['identifier'], pick['identifier'])")
          echo "runtime=$RUNTIME device=$DEVICE_TYPE"
          UDID=$(xcrun simctl create qa-e2e "$DEVICE_TYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" app/Runner.app

      - name: Run the no-funds slice
        working-directory: cake-qa
        env:
          GLM_BASE_URL: https://llm.cakewallet.com/v1
          GLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DSPARK_API_KEY }}
          E2E_SECRET_SEED_BTC: ${{ secrets.E2E_SECRET_SEED_BTC }}
          E2E_SECRET_SEED_SOL: ${{ secrets.E2E_SECRET_SEED_SOL }}
          E2E_SECRET_SEED_XMR: ${{ secrets.E2E_SECRET_SEED_XMR }}
          E2E_SECRET_SEED_NANO: ${{ secrets.E2E_SECRET_SEED_NANO }}
          CW_IOS_DEVICE: qa-e2e
          CW_IOS_APP: ${{ github.workspace }}/app/Runner.app
          SUITE: ${{ inputs.suite || 'tests/generated/no-funds.e2e.ts' }}
          GREP: ${{ inputs.grep }}
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          nohup node tools/glm-proxy.mjs > "$RUNNER_TEMP/glm-proxy.log" 2>&1 &
          sleep 2
          ARGS=(--target sim --reporter "list,junit,markdown")
          if [ -n "$SHARD" ]; then ARGS+=(--shard "$SHARD"); fi
          if [ -n "$GREP" ]; then ARGS+=(--grep "$GREP"); fi
          # node directly, not npx: npm rewrites its process title and on macOS the overflow
          # exposes the job's environment (the wallet seeds) to `ps`.
          node node_modules/.bin/e2e run "$SUITE" "${ARGS[@]}"

      - name: Redact seed-like word runs from the results
        id: redact
        if: always()
        run: node cake-qa/tools/qa/redact.mjs cake-qa/.e2e

      - name: Upload results
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-ios
          path: |
            cake-qa/.e2e/junit.xml
            cake-qa/.e2e/summary.md
          if-no-files-found: warn

      - name: Encrypt the agent trace and screenshots
        if: always() && steps.redact.outcome == 'success'
        working-directory: cake-qa/.e2e
        env:
          QA_ARTIFACT_PASSPHRASE: ${{ secrets.QA_ARTIFACT_PASSPHRASE }}
        run: |
          [ -n "$QA_ARTIFACT_PASSPHRASE" ] || exit 0
          FILES=$(ls -d report.json artifacts 2>/dev/null || true)
          [ -n "$FILES" ] || exit 0
          tar czf - $FILES | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:QA_ARTIFACT_PASSPHRASE -out "$RUNNER_TEMP/e2e-trace-ios.tgz.enc"

      - name: Upload the encrypted trace
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace-ios
          path: ${{ runner.temp }}/e2e-trace-ios.tgz.enc
          if-no-files-found: ignore
