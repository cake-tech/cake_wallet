# Layer-B e2e lane, iOS (QA handoff §6 4-b).
# Runs on the Mac Studio registered as a self-hosted runner labelled
# [self-hosted, macOS, cake-qa]. REPORT-ONLY like the Android lane
# (continue-on-error at job level; never a required check).
#
# Dispatch-only: the runner is a persistent machine, so it must not build
# every PR. A pull_request trigger can come back once the lane runs in an
# ephemeral VM.
#
# One e2e job at a time per simulator: the concurrency group is global, so
# runs on the single studio runner serialise instead of colliding.
name: E2E (iOS)

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "e.g. 2/3 (empty = single run)"
        type: string
        default: ""
      qa_ref:
        description: "cake-qa git ref to test (empty = that repo's default branch)"
        type: string
        default: ""
      suite:
        description: "test file/glob to run (empty = the no-funds slice)"
        type: string
        default: ""
      grep:
        description: "only tests whose title matches this regular expression (empty = all)"
        type: string
        default: ""
      build_run:
        description: "unused today (the lane builds its own simulator .app); kept for symmetry with the Android lane"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-ios
  cancel-in-progress: false

jobs:
  e2e-ios:
    # [self-hosted, macOS, cake-qa] — registered via tools/ci/setup_macos_runner.sh.
    runs-on: [self-hosted, macOS, cake-qa]
    environment: qa
    # REPORT-ONLY, permanently until Seth says otherwise.
    continue-on-error: true
    timeout-minutes: 180
    steps:
      - name: Checkout the app (this repo, PR ref)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout the QA project (cake-qa, via deploy key)
        uses: actions/checkout@v4
        with:
          repository: cake-tech/cake-qa
          ref: ${{ inputs.qa_ref || 'main' }}
          path: cake-qa
          ssh-key: ${{ secrets.QA_DEPLOY_KEY }}
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: cake-qa/package-lock.json

      - name: Install the QA project
        working-directory: cake-qa
        run: npm ci

      - name: Restore flutter sdk
        id: flutter-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/flutter
          key: flutter-sdk-3.41.9-${{ runner.os }}

      - name: Install Flutter
        run: |
          if [[ ! -d "$HOME/flutter/bin" ]]; then
            git clone --branch 3.41.9 --depth 1 https://github.com/flutter/flutter.git "$HOME/flutter"
          fi
          # The runner service starts with a bare PATH: the build needs Homebrew's
          # go, cmake and pod, and gomobile from ~/go/bin.
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          # Last entry wins: the pinned Flutter (and its dart) must come before Homebrew's.
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Save flutter sdk
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/flutter
          key: flutter-sdk-3.41.9-${{ runner.os }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.agent-device
          key: ios-derived-${{ github.sha }}
          restore-keys: ios-derived-

      - name: Build the simulator app (pinned recipe)
        # The runner account signs commits by default and has no gpg on PATH;
        # the dependency patch step commits with `git am`, so switch signing off here only.
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: commit.gpgsign
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: tag.gpgsign
          GIT_CONFIG_VALUE_1: "false"
        run: bash cake-qa/tools/ci/ios_sim_build.sh "$GITHUB_WORKSPACE"

      - name: Boot the pinned simulator and install
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          rts=[r for r in json.load(sys.stdin)['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable',True)]
          rts.sort(key=lambda r: r['version'])
          print(rts[-1]['identifier'])")
          DEVICE_TYPE=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          rt=[r for r in json.load(sys.stdin)['runtimes'] if r['identifier']=='$RUNTIME'][0]
          print([d for d in rt['supportedDeviceTypes'] if d.get('productFamily')=='iPhone'][0]['identifier'])")
          for OLD in $(xcrun simctl list devices -j | python3 -c "
          import json,sys
          print(' '.join(d['udid'] for a in json.load(sys.stdin)['devices'].values() for d in a if d['name']=='qa-e2e'))"); do
            xcrun simctl shutdown "$OLD" 2>/dev/null || true
            xcrun simctl delete "$OLD"
          done
          UDID=$(xcrun simctl create qa-e2e "$DEVICE_TYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app

      - name: Run the no-funds slice
        working-directory: cake-qa
        env:
          GLM_BASE_URL: https://llm.cakewallet.com/v1
          GLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DSPARK_API_KEY }}
          E2E_SECRET_SEED_BTC: ${{ secrets.E2E_SECRET_SEED_BTC }}
          E2E_SECRET_SEED_SOL: ${{ secrets.E2E_SECRET_SEED_SOL }}
          E2E_SECRET_SEED_XMR: ${{ secrets.E2E_SECRET_SEED_XMR }}
          E2E_SECRET_SEED_NANO: ${{ secrets.E2E_SECRET_SEED_NANO }}
          CW_IOS_DEVICE: qa-e2e
          CW_IOS_APP: ${{ github.workspace }}/build/ios/iphonesimulator/Runner.app
          SUITE: ${{ inputs.suite || 'tests/generated/no-funds.e2e.ts' }}
          GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          nohup node tools/glm-proxy.mjs > "$RUNNER_TEMP/glm-proxy.log" 2>&1 &
          sleep 2
          ARGS=(--target sim --reporter list,junit,markdown)
          if [ -n "${{ inputs.shard }}" ]; then ARGS+=(--shard "${{ inputs.shard }}"); fi
          if [ -n "$GREP" ]; then ARGS+=(--grep "$GREP"); fi
          # node directly, not npx: npm rewrites its process title and on macOS the overflow
          # exposes the job's environment (the wallet seeds) to `ps`.
          node node_modules/.bin/e2e run "$SUITE" "${ARGS[@]}"

      - name: Shut down and delete the simulator
        if: always()
        run: |
          [ -n "${UDID:-}" ] || exit 0
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true

      - name: Redact seed-like word runs from the results
        id: redact
        if: always()
        run: node cake-qa/tools/qa/redact.mjs cake-qa/.e2e

      - name: Upload results
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-ios
          path: |
            cake-qa/.e2e/junit.xml
            cake-qa/.e2e/summary.md
          if-no-files-found: warn

      - name: Encrypt the agent trace and screenshots
        if: always() && steps.redact.outcome == 'success'
        working-directory: cake-qa/.e2e
        env:
          QA_ARTIFACT_PASSPHRASE: ${{ secrets.QA_ARTIFACT_PASSPHRASE }}
        run: |
          [ -n "$QA_ARTIFACT_PASSPHRASE" ] || exit 0
          FILES=$(ls -d report.json artifacts 2>/dev/null || true)
          [ -n "$FILES" ] || exit 0
          tar czf - $FILES | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:QA_ARTIFACT_PASSPHRASE -out "$RUNNER_TEMP/e2e-trace-ios.tgz.enc"

      - name: Upload the encrypted trace
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace-ios
          path: ${{ runner.temp }}/e2e-trace-ios.tgz.enc
          if-no-files-found: ignore
