name: Integration Tests

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Manual trigger for shakedown runs and reruns outside a PR
  workflow_dispatch:

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-integration-tests:
    # Fork PRs get no secrets so the test build cannot be produced for them,
    # same policy as pr_test_build_android.yml
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-integration-test.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      suite_dir: integration_test/suites
      test_tier: tier0
    secrets: inherit
