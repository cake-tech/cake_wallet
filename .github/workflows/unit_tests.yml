name: Unit tests

permissions:
  contents: read
  packages: write

on: [pull_request]

defaults:
  run:
    shell: bash

jobs:
  unit_tests:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: [Linux, amd64, forlinux]
    timeout-minutes: 90
    container:
      image: ghcr.io/cake-tech/cake_wallet:debian13-flutter3.41.9-ndkr28-go1.24.1-ruststablenightly
      env:
        MONEROC_CACHE_DIR_ROOT: /opt/generic_cache
      volumes:
        - /opt/cw_cache_linux/root/.cache:/root/.cache
        - /opt/cw_cache_linux/root/.ccache:/root/.ccache
        - /opt/cw_cache_linux/root/.pub-cache/:/root/.pub-cache
        - /opt/cw_cache_linux/root/go/pkg:/root/go/pkg
        - /opt/cw_cache_linux/opt/generic_cache:/opt/generic_cache
        - /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Fix github actions messing up $HOME...
        run: "echo HOME=/root | sudo tee -a $GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: configure git
        run: |
          git config --global --add safe.directory '*'

      - name: Build dependencies utilizing ghcr cache
        run: |
          env \
            CW_DOCKER_REGISTRY=ghcr.io/cake-tech/cake_wallet \
            CW_DOCKER_USE_CLOUD=true \
            ./scripts/linux/docker/build.sh

      - name: Execute Build and Setup Commands
        run: |
          pushd scripts/linux
            source ./app_env.sh cakewallet
            ./app_config.sh
          popd

      - name: Install Flutter dependencies
        run: |
          flutter pub get

      - name: Generate placeholder secrets
        run: |
          dart run tool/generate_new_secrets.dart

      - name: Build generated code
        run: |
          ./model_generator.sh async

      - name: Generate localization
        run: |
          dart run tool/generate_localization.dart

      - name: Compile graphics
        run: |
          ./compile_graphics.sh

      - name: Run unit tests
        run: |
          failed=()
          printf "| Package | Result |\n|---|---|\n" >> "$GITHUB_STEP_SUMMARY"
          for pkg in . cw_*; do
            if [[ ! -d "$pkg/test" ]]; then
              continue
            fi
            name=$(basename "$(cd "$pkg" && pwd)")
            echo "=== flutter test: $name ==="
            if (cd "$pkg" && flutter test); then
              echo "| $name | passed |" >> "$GITHUB_STEP_SUMMARY"
            else
              failed+=("$name")
              echo "| $name | FAILED |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Unit tests failed in: ${failed[*]}"
            exit 1
          fi
          echo "All unit tests passed"
