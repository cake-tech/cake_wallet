name: Funds Integration Tests

permissions:
  contents: read
  packages: write

# This test is never triggered automatically as it moves real funds
on:
  workflow_dispatch:
    inputs:
      flows:
        description: "Which flows to run"
        required: true
        type: choice
        options:
          - all
          - send
          - swap
        default: all
      chains:
        description: "auto discovers every funded chain, or a comma separated list of wallet type names"
        required: true
        type: string
        default: auto
      spend:
        description: "Actually broadcast and create trades. Off runs the dry runs only"
        required: true
        type: boolean
        default: false
      record_screen:
        description: "Record the emulator screen, uploaded GPG encrypted"
        required: true
        type: boolean
        default: true

concurrency:
  group: funds-integration-tests
  cancel-in-progress: false

jobs:
  funds-tests:
    uses: ./.github/workflows/reusable-integration-test.yml
    with:
      ref: ${{ github.sha }}
      suite_dir: integration_test/funds_suites
      test_tier: all
      write_funds_secrets: true
      record_screen: ${{ inputs.record_screen }}
      timeout_minutes: 120
      extra_dart_defines: "FLOWS=${{ inputs.flows }};CHAINS=${{ inputs.chains }};SPEND=${{ inputs.spend }}"
    secrets: inherit

  notify:
    needs: [funds-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Post result to slack
        continue-on-error: true
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TESTS_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_TESTS_CHANNEL }}
          RESULT: ${{ needs.funds-tests.result }}
          FLOWS: ${{ inputs.flows }}
          CHAINS: ${{ inputs.chains }}
          SPEND: ${{ inputs.spend }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$SLACK_TOKEN" || -z "$SLACK_CHANNEL" ]]; then
            echo "::notice::No slack token or channel configured, skipping the report"
            exit 0
          fi

          if [[ "$RESULT" == "success" ]]; then
            headline=":white_check_mark: Funds integration tests passed"
          else
            headline=":x: Funds integration tests $RESULT"
          fi

          # spend is the one that says whether this moved real money or only priced it
          message=$(
            printf '%s\n%s\n\nflows: %s, chains: %s, spend: %s\n%s' \
              "$headline" "$BRANCH" "$FLOWS" "$CHAINS" "$SPEND" "$RUN_URL"
          )

          response=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$message" \
              '{channel: $channel, text: $text}')")

          if [[ "$(jq -r '.ok' <<< "$response")" != "true" ]]; then
            error=$(jq -r '.error // "unknown"' <<< "$response")
            needed=$(jq -r '.needed // empty' <<< "$response")

            if [[ -n "$needed" ]]; then
              echo "::warning::Slack rejected the report: $error, it wants the $needed scope"
            else
              echo "::warning::Slack rejected the report: $error"
            fi
          fi
