# this is a separate workflow mostly because github's macos runner is too slow to build torch within 6 hours
# there is no technical reason to not build ios torch on macos as well, but to have it work in ci we'd need to selfhost gh actions
name: Create iOS torch cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/prepare_torch.sh
      - scripts/ios/build_torch.sh
      - scripts/ios/docker/**
      - .github/workflows/create_ios_torch_cache.yml

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: [Linux, amd64, forlinux]
    container:
      image: ghcr.io/cake-tech/cake_wallet:debian13-flutter3.41.9-ndkr28-go1.24.1-ruststablenightly
      volumes:
        - /opt/cw_cache_linux/root/.cache:/root/.cache
        - /opt/cw_cache_linux/root/go/pkg:/root/go/pkg
        - /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Fix github actions messing up $HOME...
        run: "echo HOME=/root | sudo tee -a $GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: configure git
        run: git config --global --add safe.directory '*'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dependencies utilizing ghcr cache
        run: |
          env \
            CW_DOCKER_REGISTRY=ghcr.io/cake-tech/cake_wallet \
            CW_DOCKER_USE_CLOUD=true \
            ./scripts/ios/docker/build.sh
