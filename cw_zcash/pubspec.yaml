name: cw_zcash
description: Zcash library for cake wallet
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  warp_api:
    path: ../scripts/zcash_lib/packages/warp_api_ffi
  cw_core:
    path: ../cw_core
  mobx: ^2.6.0
  bip39: ^1.0.6
  mutex: ^3.1.0

  path: any
  flat_buffers: any
  zkool:
    git:
      url: https://github.com/cake-tech/zkool2
      ref: b1642f260da4fa00dd2f8d4dd689073d0b56960a

  path_provider: any
dependency_overrides:
  decimal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.7
#  hive_generator: ^2.0.1
  ffigen: ^20.1.1
