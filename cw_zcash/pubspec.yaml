name: cw_zcash
description: Zcash library for cake wallet
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cw_core:
    path: ../cw_core
  mobx: ^2.6.0
  bip39: ^1.0.6
  mutex: ^3.1.0

  path: any
  flat_buffers: any
  zkool:
    git:
      url: https://github.com/cake-tech/zkool2.git
      ref: ec5f72e3d8b700a8014cf7c3ce4de2896e24620b
  path_provider: any
  sqflite_common_ffi: any
  ur:
    git:
      url: https://github.com/bukata-sa/bc-ur-dart
      ref: 5738f70d0ec3d50977ac3dd01fed62939600238b
dependency_overrides:
  decimal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.7
#  hive_generator: ^2.0.1
  ffigen: ^20.1.1
