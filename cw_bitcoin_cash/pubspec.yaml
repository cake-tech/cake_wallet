name: cw_bitcoin_cash
description: A new Flutter package project.
version: 0.0.1
publish_to: none
homepage: https://cakewallet.com

environment:
  sdk: ">=2.17.5 <3.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  bip39: ^1.0.6
  bip32: ^2.0.0
  path_provider: ^2.0.11
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  cw_core:
    path: ../cw_core
  cw_bitcoin:
    path: ../cw_bitcoin
  bitbox:
    git:
      url: https://github.com/cake-tech/bitbox-flutter.git
      ref: Add-Support-For-OP-Return-data
  blockchain_utils:
    git:
      url: https://github.com/cake-tech/blockchain_utils
      ref: cake-update-v2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.6

dependency_overrides:
  watcher: ^1.1.0
  bitcoin_base:
    git:
      url: https://github.com/cake-tech/bitcoin_base
      ref: cake-update-v11

flutter:
    uses-material-design: true
